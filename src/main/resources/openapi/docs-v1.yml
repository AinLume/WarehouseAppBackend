openapi: "3.1.0"
info:
  title: "WarehouseApp API"
  description: "WarehouseApp API"
  version: "1.0.0"
servers:
  - url: "https://localhost:8080"

tags:
  - name: Categories
    description: Управление категориями товаров
  - name: Products
    description: Управление товарами
  - name: Suppliers
    description: Управление поставщиками
  - name: Warehouse
    description: Управление складами и остатками
  - name: Supply
    description: Управление поставками и их статусами
  - name: App
    description: Эдпоинты для проверки состояния бэкэнда

paths:
  /api/v1/categories:
    get:
      tags: [Categories]
      description: "GET /categories — список всех категорий"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CategoryResponse"
    post:
      tags: [Categories]
      description: "POST /categories — создать категорию"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Map_String"
        "201":
          description: "Created"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
