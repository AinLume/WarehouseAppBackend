components:
  schemas:
    Map:
      type: "object"
      properties: { }
    Map_String:
      type: "string"
    CategoryResponse:
      type: "object"
      properties:
        categoryId:
          type: "integer"
          format: "int32"
        title:
          type: "string"
      required:
        - "categoryId"
        - "title"
    CreateCategoryRequest:
      type: "object"
      properties:
        title:
          type: "string"
      required:
        - "title"
    UpdateCategoryRequest:
      type: "object"
      properties:
        title:
          type: "string"
      required:
        - "title"
    ProductResponse:
      type: "object"
      properties:
        productId:
          type: "integer"
          format: "int64"
        categoryId:
          type: "integer"
          format: "int32"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        width:
          type: "integer"
          format: "int32"
        length:
          type: "integer"
          format: "int32"
        height:
          type: "integer"
          format: "int32"
        volume:
          type: "number"
          format: "double"
      required:
        - "productId"
        - "categoryId"
        - "title"
        - "width"
        - "length"
        - "height"
        - "volume"
    ProductExResponse:
      type: "object"
      properties:
        productId:
          type: "integer"
          format: "int64"
        categoryId:
          type: "integer"
          format: "int32"
        categoryTitle:
          type: "string"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        width:
          type: "integer"
          format: "int32"
        length:
          type: "integer"
          format: "int32"
        height:
          type: "integer"
          format: "int32"
        volume:
          type: "number"
          format: "double"
      required:
        - "productId"
        - "categoryId"
        - "title"
        - "width"
        - "length"
        - "height"
        - "volume"
    CreateProductRequest:
      type: "object"
      properties:
        categoryId:
          type: "integer"
          format: "int32"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        width:
          type: "integer"
          format: "int32"
        length:
          type: "integer"
          format: "int32"
        height:
          type: "integer"
          format: "int32"
      required:
        - "categoryId"
        - "title"
        - "width"
        - "length"
        - "height"
    UpdateProductRequest:
      type: "object"
      properties:
        categoryId:
          type: "integer"
          format: "int32"
          nullable: true
        title:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
        width:
          type: "integer"
          format: "int32"
          nullable: true
        length:
          type: "integer"
          format: "int32"
          nullable: true
        height:
          type: "integer"
          format: "int32"
          nullable: true
    SupplierResponse:
      type: "object"
      properties:
        supplierId:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        phone:
          type: "string"
        email:
          type: "string"
          nullable: true
        address:
          type: "string"
          nullable: true
      required:
        - "supplierId"
        - "name"
        - "phone"
    CreateSupplierRequest:
      type: "object"
      properties:
        name:
          type: "string"
        phone:
          type: "string"
        email:
          type: "string"
          nullable: true
        address:
          type: "string"
          nullable: true
      required:
        - "name"
        - "phone"
    UpdateSupplierRequest:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        phone:
          type: "string"
          nullable: true
        email:
          type: "string"
          nullable: true
        address:
          type: "string"
          nullable: true
    SupplyResponse:
      type: "object"
      properties:
        supplyId:
          type: "integer"
          format: "int64"
        supplierId:
          type: "integer"
          format: "int32"
        supplierName:
          type: "string"
        warehouseId:
          type: "integer"
          format: "int32"
        warehouseTitle:
          type: "string"
        status:
          $ref: "#/components/schemas/SupplyStatus"
        totalPrice:
          type: "integer"
          format: "int64"
        createdAt:
          type: "string"
        updatedAt:
          type: "string"
      required:
        - "supplyId"
        - "supplierId"
        - "supplierName"
        - "warehouseId"
        - "status"
        - "totalPrice"
        - "createdAt"
        - "updatedAt"
    CreateSupplyRequest:
      type: "object"
      properties:
        supplierId:
          type: "integer"
          format: "int32"
